<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Idle Clicker</title>
        <link rel="stylesheet" href="libs/swiper/index.css" />
        <link rel="stylesheet" href="index.css" />
    </head>
    <body>
        <div id="app">
            <div class="hud">
                <div class="hud__item">Кредити: <span id="hud-credits">0</span></div>
                <div class="hud__item" id="hud-storage">
                    <div class="hud__storage-total">Склад: <span id="hud-storage-used">0</span> / <span id="hud-storage-capacity">0</span></div>
                    <div class="hud__cargo">
                        <span class="hud__ore" title="Залізо"><img class="hud__ore-icon" src="assets/ore-iron.png" alt="Залізо" /><span id="hud-cargo-iron">0</span></span>
                        <span class="hud__ore" title="Мідь"><img class="hud__ore-icon" src="assets/ore-copper.png" alt="Мідь" /><span id="hud-cargo-copper">0</span></span>
                        <span class="hud__ore" title="Золото"><img class="hud__ore-icon" src="assets/ore-gold.png" alt="Золото" /><span id="hud-cargo-gold">0</span></span>
                        <span class="hud__ore" title="Алмаз"><img class="hud__ore-icon" src="assets/ore-ice.png" alt="Алмаз" /><span id="hud-cargo-diamond">0</span></span>
                    </div>
                </div>
                <button class="hud__item hud__button" id="hud-sell" type="button">Продати все (+<span id="hud-sell-value">0</span>)</button>
                <button class="hud__item hud__button" id="hud-location" type="button">Локація: <span id="hud-location-name"></span></button>
            </div>
            <div class="shop">
                <button class="hud__item hud__button shop__button" id="shop-storage" type="button">
                    <span class="shop__title">Склад +25</span>
                    <span class="shop__info">Рівень <span id="shop-storage-level">0</span> · <span id="shop-storage-cost">0</span> кр.</span>
                </button>
                <button class="hud__item hud__button shop__button" id="shop-drill" type="button">
                    <span class="shop__title">Бур +1 до удару</span>
                    <span class="shop__info">Рівень <span id="shop-drill-level">0</span> · <span id="shop-drill-cost">0</span> кр.</span>
                </button>
                <button class="hud__item hud__button shop__button" id="shop-drone" type="button">
                    <span class="shop__title">Дрон-шахтар +0.5 руди/с</span>
                    <span class="shop__info">Дронів <span id="shop-drone-count">0</span> · <span id="shop-drone-cost">0</span> кр.</span>
                </button>
            </div>
            <div class="locations" id="locations">
                <div class="locations__dialog">
                    <button class="locations__close" id="locations-close" type="button" aria-label="Закрити">×</button>
                    <div class="swiper locations__swiper" id="locations-swiper">
                        <div class="swiper-wrapper" id="locations-slides"></div>
                        <div class="swiper-button-prev"></div>
                        <div class="swiper-button-next"></div>
                        <div class="swiper-pagination"></div>
                    </div>
                </div>
            </div>
        </div>
        <script src="libs/swiper/index.js"></script>
        <script src="index.js"></script>
    </body>
</html>
