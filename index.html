<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Idle Clicker</title>
        <link rel="stylesheet" href="index.css" />
    </head>
    <body>
        <div id="app">
            <div class="hud">
                <div class="hud__item">Кредити: <span id="hud-credits">0</span></div>
                <div class="hud__item" id="hud-storage">
                    <div class="hud__storage-total">Склад: <span id="hud-storage-used">0</span> / <span id="hud-storage-capacity">0</span></div>
                    <div class="hud__cargo">
                        <span class="hud__ore" title="Залізо"><img class="hud__ore-icon" src="assets/ore-iron.png" alt="Залізо" /><span id="hud-cargo-iron">0</span></span>
                        <span class="hud__ore" title="Мідь"><img class="hud__ore-icon" src="assets/ore-copper.png" alt="Мідь" /><span id="hud-cargo-copper">0</span></span>
                        <span class="hud__ore" title="Золото"><img class="hud__ore-icon" src="assets/ore-gold.png" alt="Золото" /><span id="hud-cargo-gold">0</span></span>
                        <span class="hud__ore" title="Алмаз"><img class="hud__ore-icon" src="assets/ore-ice.png" alt="Алмаз" /><span id="hud-cargo-diamond">0</span></span>
                    </div>
                </div>
                <button class="hud__item hud__button" id="hud-sell" type="button">Продати все (+<span id="hud-sell-value">0</span>)</button>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
